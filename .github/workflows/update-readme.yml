name: Access log

on:
  schedule:
    # Once a day. GitHub can delay scheduled runs by a few hours
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render access log
        run: node scripts/access-log.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "yeisonfjrd"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh access log [$(date +'%Y-%m-%d')]"
          git push
